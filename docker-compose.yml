volumes:
  postgres_volume:

services:
  pg:
    image: postgres:14-alpine3.17
    container_name: avito-pr-postgres
    environment:
      - "POSTGRES_DB=${PG_DATABASE_NAME:-avito_pr}"
      - "POSTGRES_USER=${PG_USER:-postgres}"
      - "POSTGRES_PASSWORD=${PG_PASSWORD:-postgres}"
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: "config/migration.Dockerfile"
    container_name: avito-pr-migrator
    depends_on:
      pg:
        condition: service_healthy
    environment:
      - "PG_DATABASE_NAME=${PG_DATABASE_NAME:-avito_pr}"
      - "PG_USER=${PG_USER:-postgres}"
      - "PG_PASSWORD=${PG_PASSWORD:-postgres}"
      - "MIGRATION_DIR=${MIGRATION_DIR:-migrations}"
    restart: on-failure

