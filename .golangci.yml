run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: false

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  govet: {}
  gocyclo:
    min-complexity: 25
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  revive:
    rules:
      - name: exported
        disabled: true
      - name: var-naming
        severity: warning
      - name: package-comments
        disabled: true
  gosec:
    severity: medium
    confidence: medium 

linters:
  disable-all: true
  enable:
    - errcheck
    - goimports
    - govet
    - ineffassign
    - typecheck
    - unused
    - staticcheck
    - gosec
    - gocritic
    - revive
    - errname
    - goconst
    - misspell
    - unconvert
    - gocyclo

issues:
  exclude-use-default: false
  exclude-files:
    - \.pb\.go$
    - \.pb\.gw\.go$
    - mock_.*\.go$
  exclude-dirs:
    - bin
    - vendor
    - var
    - tmp
    - .cache
    - internal/repository/mocks
    - internal/service/mocks
  exclude:
    - G104
    - G112
    - exported func .* returns unexported type .*
    - should have a package comment
    - don't use an underscore in package name
    - Error return value of .*json.*Encoder.*Encode.* is not checked
    - exported .* should have comment
    - exported type .* should have comment
    - exported function .* should have comment
    - exported method .* should have comment
    - exported var .* should have comment
    - exported const .* should have comment
    - exitAfterDefer
    - SA1029